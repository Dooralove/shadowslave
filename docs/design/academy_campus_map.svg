  <text x="460" y="620" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#f2cfaa">табло · угол Кассии</text>
  <text x="460" y="645" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#c79b6b">новая сцена</text>
  <circle cx="380" cy="680" r="4" fill="#ffb15e"/><text x="392" y="684" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#f2cfaa">кухня</text>
  <circle cx="540" cy="680" r="4" fill="#ffb15e"/><text x="552" y="684" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#f2cfaa">табло</text>

  <!-- A5 dojo -->
  <rect x="1010" y="540" width="270" height="200" rx="8" fill="#3a2412" stroke="#d08a3a" stroke-width="2"/>
  <text x="1145" y="572" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" fill="#ffe6c7">A5 · ДОДЗЁ</text>
  <text x="1145" y="598" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#f2cfaa">ринг · датчик удара</text>
  <text x="1145" y="620" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#f2cfaa">шкафчики · двор</text>
  <text x="1145" y="645" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#c79b6b">новая сцена</text>
  <circle cx="1070" cy="680" r="4" fill="#ffb15e"/><text x="1082" y="684" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#f2cfaa">ринг</text>
  <circle cx="1220" cy="680" r="4" fill="#ffb15e"/><text x="1232" y="684" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#f2cfaa">двор</text>

  <!-- A6 academic -->
  <rect x="330" y="120" width="260" height="160" rx="8" fill="#3a2412" stroke="#d08a3a" stroke-width="2"/>
  <text x="460" y="152" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="700" fill="#ffe6c7">A6 · АКАДЕМИЧЕСКОЕ</text>
  <text x="460" y="178" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#f2cfaa">Wilderness · мёртвые языки</text>
  <text x="460" y="200" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#f2cfaa">библиотека · интервью</text>
  <text x="460" y="225" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#c79b6b">2F, лестница из столовой</text>
  <text x="460" y="250" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#c79b6b">новая сцена</text>

  <!-- A7 medical -->
  <rect x="1210" y="300" width="260" height="200" rx="8" fill="#3a2412" stroke="#d08a3a" stroke-width="2"/>
  <text x="1340" y="332" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" fill="#ffe6c7">A7 · МЕДКОРПУС</text>
  <text x="1340" y="358" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#f2cfaa">приёмная · целители</text>
  <text x="1340" y="380" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#f2cfaa">Hollow · палаты</text>
  <text x="1340" y="405" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#c79b6b">новая сцена</text>
  <circle cx="1290" cy="440" r="4" fill="#ffb15e"/><text x="1302" y="444" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#f2cfaa">Hollow</text>
  <circle cx="1400" cy="440" r="4" fill="#ffb15e"/><text x="1412" y="444" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#f2cfaa">капсулы</text>

  <!-- A8 underlevels -->
  <rect x="620" y="150" width="360" height="110" rx="8" fill="#1a1f26" stroke="#7a8794" stroke-width="2" stroke-dasharray="8 5"/>
  <text x="800" y="182" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" fill="#eaf2f8">A8 · ПОДВАЛЫ</text>
  <text x="800" y="208" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#bcd3e6">тоннели · фильтры · архив · тайник</text>
  <text x="800" y="232" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#7f9ab0">design-only / опционально</text>

  <!-- connectors -->
  <line x1="800" y1="930" x2="800" y2="914" stroke="#8fd3ff" stroke-width="5" marker-end="url(#arrow)"/>
  <line x1="800" y1="790" x2="800" y2="764" stroke="#8fd3ff" stroke-width="5" marker-end="url(#arrow)"/>
  <line x1="620" y1="650" x2="594" y2="650" stroke="#8fd3ff" stroke-width="5" marker-end="url(#arrow)"/>
  <line x1="980" y1="650" x2="1006" y2="650" stroke="#8fd3ff" stroke-width="5" marker-end="url(#arrow)"/>
  <line x1="800" y1="520" x2="800" y2="504" stroke="#8fd3ff" stroke-width="5" marker-end="url(#arrow)"/>
  <line x1="620" y1="390" x2="604" y2="390" stroke="#ffb15e" stroke-width="4" marker-end="url(#arrowWarm)"/>
  <line x1="980" y1="380" x2="996" y2="380" stroke="#ffb15e" stroke-width="4" marker-end="url(#arrowWarm)"/>
  <line x1="1095" y1="450" x2="1095" y2="500" stroke="#ffb15e" stroke-width="4" stroke-dasharray="6 4"/>
  <line x1="1190" y1="380" x2="1206" y2="380" stroke="#ffb15e" stroke-width="4" marker-end="url(#arrowWarm)"/>
  <line x1="800" y1="300" x2="800" y2="264" stroke="#7a8794" stroke-width="4" stroke-dasharray="8 5" marker-end="url(#arrow)"/>
  <line x1="460" y1="540" x2="460" y2="284" stroke="#ffb15e" stroke-width="4" stroke-dasharray="7 5" marker-end="url(#arrowWarm)"/>
  <text x="474" y="510" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#ffb15e">лестница 2F</text>

  <!-- flow labels -->
  <text x="812" y="875" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#8fd3ff">главный вход</text>
  <text x="812" y="745" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#8fd3ff">ось к Sleeper Center</text>
  <text x="1000" y="745" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#8fd3ff">ответвление</text>

  <!-- legend -->
  <g transform="translate(60,760)">
    <rect x="0" y="0" width="250" height="250" rx="10" fill="#10161d" stroke="#24303c" stroke-width="2"/>
    <text x="18" y="30" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700" fill="#eaf2f8">ЛЕГЕНДА</text>
    <rect x="18" y="48" width="26" height="16" fill="#12324a" stroke="#3f8fc4" stroke-width="2"/>
    <text x="56" y="62" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#bcd3e6">существующая сцена</text>
    <rect x="18" y="76" width="26" height="16" fill="#3a2412" stroke="#d08a3a" stroke-width="2"/>
    <text x="56" y="90" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#f2cfaa">новая сцена</text>
    <rect x="18" y="104" width="26" height="16" fill="#1a1f26" stroke="#7a8794" stroke-width="2"/>
    <text x="56" y="118" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#bcd3e6">подзона / опционально</text>
    <line x1="18" y1="144" x2="44" y2="144" stroke="#8fd3ff" stroke-width="5" marker-end="url(#arrow)"/>
    <text x="56" y="149" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#bcd3e6">переход / ось</text>
    <line x1="18" y1="170" x2="44" y2="170" stroke="#ffb15e" stroke-width="4" stroke-dasharray="6 4"/>
    <text x="56" y="175" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#f2cfaa">лестница / вертикаль</text>
    <line x1="18" y1="196" x2="44" y2="196" stroke="#7a8794" stroke-width="4" stroke-dasharray="8 5"/>
    <text x="56" y="201" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#bcd3e6">design-only</text>
    <circle cx="26" cy="222" r="5" fill="#8fd3ff"/>
    <text x="56" y="227" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#bcd3e6">POI / landmark</text>
  </g>

  <!-- notes -->
  <text x="800" y="1080" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#5f7385">Схема не заменяет 3D-планировку. Координаты и размеры — проектные (PRELIM); финальные значения проверяются в сцене.</text>

  <!-- title block -->
  <rect x="60" y="90" width="250" height="76" rx="8" fill="#10161d" stroke="#24303c" stroke-width="2"/>
  <text x="76" y="118" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#9fb3c8">ГЛАВНАЯ ОСЬ</text>
  <text x="76" y="142" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#eaf2f8">ворота → плац → галерея</text>
  <text x="76" y="160" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#eaf2f8">→ Sleeper Center → капсула</text>
</svg>
