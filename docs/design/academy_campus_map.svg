<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1100" width="1600" height="1100" role="img" aria-label="Схема Академии Пробуждённых">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8fd3ff"/>
    </marker>
    <marker id="arrowWarm" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#ffb15e"/>
    </marker>
    <pattern id="hatch" width="8" height="8" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#4c5866" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1600" height="1100" fill="#0b0f14"/>
  <rect x="20" y="20" width="1560" height="1060" rx="14" fill="none" stroke="#24303c" stroke-width="2"/>

  <text x="800" y="62" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="700" fill="#eaf2f8">АКАДЕМИЯ ПРОБУЖДЁННЫХ</text>
  <text x="800" y="94" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#9fb3c8">Схема главы M2-full · экстерьер и Sleeper Center · не в масштабе</text>

  <!-- north arrow -->
  <g transform="translate(1480,120)">
    <line x1="0" y1="46" x2="0" y2="-12" stroke="#8fd3ff" stroke-width="3"/>
    <path d="M 0 -26 L -9 -6 L 9 -6 Z" fill="#8fd3ff"/>
    <text x="0" y="72" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#9fb3c8">СЕВЕР</text>
  </g>

  <!-- A0 approach -->
  <rect x="650" y="930" width="300" height="110" rx="8" fill="#12324a" stroke="#3f8fc4" stroke-width="2"/>
  <text x="800" y="962" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#eaf2f8">A0 · ПОДЪЕЗД</text>
  <text x="800" y="990" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#bcd3e6">машина Джет · КПП · зимняя дорога</text>
  <text x="800" y="1015" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#7f9ab0">существующая сцена</text>
  <circle cx="710" cy="1028" r="4" fill="#8fd3ff"/><text x="722" y="1032" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#bcd3e6">машина</text>
  <circle cx="880" cy="1028" r="4" fill="#8fd3ff"/><text x="892" y="1032" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#bcd3e6">КПП</text>

  <!-- A1 gate -->
  <rect x="600" y="790" width="400" height="120" rx="8" fill="#12324a" stroke="#3f8fc4" stroke-width="2"/>
  <text x="800" y="822" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#eaf2f8">A1 · ВОРОТА И СТЕНА</text>
  <text x="800" y="850" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#bcd3e6">красные ворота · ров · мост · башни · турели</text>
  <text x="800" y="875" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#7f9ab0">существующая сцена + арт-пас</text>
  <circle cx="700" cy="895" r="4" fill="#8fd3ff"/><text x="712" y="899" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#bcd3e6">башня W</text>
  <circle cx="900" cy="895" r="4" fill="#8fd3ff"/><text x="912" y="899" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#bcd3e6">башня E</text>

  <!-- A9 wall walk -->
  <rect x="600" y="772" width="400" height="14" rx="4" fill="#1a1f26" stroke="#7a8794" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="800" y="783" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#c7d3dd">A9 · WALL WALK (опционально)</text>

  <!-- A2 campus -->
  <rect x="620" y="520" width="360" height="240" rx="8" fill="#12324a" stroke="#3f8fc4" stroke-width="2"/>
  <text x="800" y="552" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#eaf2f8">A2 · ПЛАЦ</text>
  <text x="800" y="580" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#bcd3e6">галерея · мемориал · флаги · указатели</text>
  <text x="800" y="605" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#7f9ab0">существующая сцена + арт-пас</text>

  <!-- gallery -->
  <rect x="700" y="620" width="200" height="110" rx="6" fill="#1a1f26" stroke="#7a8794" stroke-width="1.5"/>
  <text x="800" y="652" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#eaf2f8">A2b · ГАЛЕРЕЯ</text>
  <text x="800" y="676" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#bcd3e6">колонны · стеклянная крыша</text>
  <text x="800" y="696" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#bcd3e6">тёплые полосы · индукция</text>
  <text x="800" y="716" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#7f9ab0">подзона</text>

  <!-- A3 sleeper center -->
  <rect x="620" y="300" width="360" height="200" rx="8" fill="#12324a" stroke="#3f8fc4" stroke-width="2"/>
  <text x="800" y="332" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#eaf2f8">A3 · SLEEPER CENTER</text>
  <text x="800" y="360" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#bcd3e6">дортуар · общая · душевые</text>
  <text x="800" y="382" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#bcd3e6">наблюдение · Hollow · dream ward</text>
  <text x="800" y="407" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#7f9ab0">существующая сцена + арт-пас</text>
  <circle cx="700" cy="430" r="4" fill="#8fd3ff"/><text x="712" y="434" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#bcd3e6">12 капсул</text>
  <circle cx="900" cy="430" r="4" fill="#8fd3ff"/><text x="912" y="434" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#bcd3e6">Hollow</text>
  <circle cx="800" cy="465" r="4" fill="#8fd3ff"/><text x="812" y="469" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#bcd3e6">вход с плаца</text>

  <!-- A3b residential -->
  <rect x="330" y="300" width="270" height="170" rx="8" fill="#3a2412" stroke="#d08a3a" stroke-width="2"/>
  <text x="465" y="332" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" fill="#ffe6c7">A3b · РЕЗИДЕНЦИЯ</text>
  <text x="465" y="358" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#f2cfaa">8 комнат · комната 07</text>
  <text x="465" y="380" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#f2cfaa">прачечная · умывальная</text>
  <text x="465" y="405" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#c79b6b">новая сцена</text>

  <!-- A3e hollow -->
  <rect x="1000" y="300" width="190" height="150" rx="8" fill="#3a2412" stroke="#d08a3a" stroke-width="2"/>
  <text x="1095" y="332" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#ffe6c7">A3e · HOLLOW</text>
  <text x="1095" y="358" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#f2cfaa">кресла · простыни</text>
  <text x="1095" y="380" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#f2cfaa">мемориал · холод</text>
  <text x="1095" y="405" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#c79b6b">подзона A3</text>

  <!-- A4 dining -->
  <rect x="330" y="540" width="260" height="200" rx="8" fill="#3a2412" stroke="#d08a3a" stroke-width="2"/>
  <text x="460" y="572" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" fill="#ffe6c7">A4 · СТОЛОВАЯ</text>
